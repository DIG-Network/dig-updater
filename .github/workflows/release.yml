# STABLE binary release. On a `vX.Y.Z` tag (cut by the nightly-release orchestrator's stable
# job — nightly-release.yml — either from the midnight cron detecting a version bump or from a
# manual `workflow_dispatch`), this workflow builds both beacon binaries for every OS/arch (via
# the reusable build workflow) and publishes them to a STABLE GitHub Release: `prerelease: false`,
# marked `latest`. The changelog is already inside the tag (the orchestrator committed it before
# tagging), so the release notes carry the shipped changelog.
#
# This is intentionally tag-ONLY: merges to main no longer build or release here (#590 batches
# releases to the nightly cron + manual dispatch). Pre-merge coverage comes from ci.yml (full
# fmt/clippy/test/coverage/build on every PR); daily main-HEAD build coverage comes from the
# nightly channel. A `workflow_dispatch` is kept as a manual "does main still build?" canary — it
# builds but does not publish (publish is gated on a tag ref).
name: Release (stable)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Resolve the version string the artifacts are stamped with: `X.Y.Z` from a `vX.Y.Z` tag, or a
  # `g<shortsha>` build id for the manual canary (which never publishes).
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=g$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Build every OS/arch through the shared reusable workflow — the same build the nightly channel
  # uses, so the two release paths can never diverge on how a binary is produced.
  build:
    name: Build
    needs: meta
    uses: ./.github/workflows/build-binaries.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      # Empty ref => build the tag/commit this run is on.
      ref: ""

  # Publish ONLY for a real tag — the manual-dispatch canary builds but stops here.
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
      - name: Create / update the STABLE release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          # `prerelease: false` + `make_latest: true`: a stable release is the one that moves
          # `latest`. Nightlies (nightly-release.yml) are always prerelease + never latest, so a
          # nightly can never masquerade as this stable download.
          prerelease: false
          make_latest: "true"
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # WAKE THE FEED (dig_ecosystem#3046). Publishing the release is NOT shipping: users install
      # from the signed feed at updates.dig.net, and until this dispatch existed the feed only
      # refreshed on a 6-hourly cron — so a release stayed invisible for up to six hours while every
      # check above stayed green. dig-updater is itself a component of that feed, so its own release
      # must wake it exactly as a sibling component's release does.
      #
      # `RELEASE_TOKEN`, NOT `github.token` — THIS IS LOAD-BEARING. GitHub deliberately does not
      # start a workflow run from an event sent with the automatic `GITHUB_TOKEN` (its recursion
      # guard). A dispatch sent with it returns 204 and silently starts NOTHING, which would
      # reproduce this ticket's own defect class — a release step that reports success while doing
      # nothing — in the very code meant to close it. The same reason the runbook already requires
      # `RELEASE_TOKEN` for pushing tags that trigger downstream workflows.
      #
      # Fail-soft: the release itself is complete and correct by this point, so a dispatch hiccup
      # must not red it. The cost of a missed dispatch is bounded — the 6-hourly cron still refreshes
      # the feed, and the daily `audit-freshness` job reds if it somehow does not.
      # The secret is tested in the script, not in an `if:` — the `secrets` context is not dependable
      # in step conditionals, and this workflow already treats a missing RELEASE_TOKEN as a warned
      # no-op elsewhere. The version comes from the tag this job is gated on (`github.ref_type ==
      # 'tag'`), so it needs no output from an upstream job.
      - name: Notify the feed that a new version was released
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::RELEASE_TOKEN is not set — the feed was NOT signalled, so this release stays invisible to the updater until the next 6-hourly feed cron (dig_ecosystem#3046)."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type=component-released \
            -f "client_payload[component]=dig-updater" \
            -f "client_payload[version]=${version}"
          echo "Signalled the feed: dig-updater ${version} released."
